<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="t d"><title id="t">Fluxo de uma decisão se e senão</title><desc id="d">A condição direciona a execução para o bloco verdadeiro ou para o bloco senão, que depois se reúne.</desc><rect width="720" height="250" rx="18" fill="#f4f7fc"/><g font-family="system-ui,sans-serif" text-anchor="middle"><rect x="24" y="94" width="110" height="58" rx="12" fill="#173e68"/><text x="79" y="129" fill="white" font-size="15" font-weight="700">início</text><path d="M134 123h56" stroke="#607a98" stroke-width="3"/><path d="m182 116 10 7-10 7" fill="none" stroke="#607a98" stroke-width="3"/><path d="M260 61 326 123 260 185 194 123z" fill="#fff" stroke="#2360a0" stroke-width="3"/><text x="260" y="128" fill="#173e68" font-size="14" font-weight="700">condição?</text><path d="M326 123h62V60h54" stroke="#607a98" stroke-width="3" fill="none"/><path d="m435 53 10 7-10 7" fill="none" stroke="#607a98" stroke-width="3"/><path d="M326 123h62v67h54" stroke="#607a98" stroke-width="3" fill="none"/><path d="m435 183 10 7-10 7" fill="none" stroke="#607a98" stroke-width="3"/><rect x="445" y="34" width="136" height="52" rx="10" fill="#dcefe7" stroke="#39815e" stroke-width="2"/><text x="513" y="66" fill="#174b35" font-size="14" font-weight="700">se verdadeiro</text><rect x="445" y="164" width="136" height="52" rx="10" fill="#fbe8df" stroke="#a95834" stroke-width="2"/><text x="513" y="196" fill="#6e321c" font-size="14" font-weight="700">senao</text><path d="M581 60h65v63M581 190h65v-67" stroke="#607a98" stroke-width="3" fill="none"/><path d="m638 130 8-7 8 7" fill="none" stroke="#607a98" stroke-width="3"/><rect x="646" y="94" width="60" height="58" rx="12" fill="#173e68"/><text x="676" y="129" fill="white" font-size="14" font-weight="700">segue</text><text x="355" y="238" fill="#4c6078" font-size="12">Cada caminho executa um bloco; depois o fluxo continua.</text></g></svg>
