<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-labelledby="t d"><title id="t">Camadas de precedência dos operadores</title><desc id="d">A ordem visual vai dos parênteses e operadores unários até os operadores lógicos ou e xou.</desc><rect width="720" height="340" rx="18" fill="#f4f7fc"/><text x="30" y="42" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#173e68">Da maior para a menor precedência</text><g font-family="ui-monospace,monospace" font-size="14" font-weight="700"><rect x="30" y="62" width="610" height="30" rx="7" fill="#173e68"/><text x="48" y="82" fill="white">1 · ( )</text><rect x="30" y="101" width="565" height="30" rx="7" fill="#24578a"/><text x="48" y="121" fill="white">2 · +x  -x  nao</text><rect x="30" y="140" width="520" height="30" rx="7" fill="#287c77"/><text x="48" y="160" fill="white">3 · ^</text><rect x="30" y="179" width="475" height="30" rx="7" fill="#438263"/><text x="48" y="199" fill="white">4 · *  /  \  div  mod  %</text><rect x="30" y="218" width="430" height="30" rx="7" fill="#9a7626"/><text x="48" y="238" fill="white">5 · +  -</text><rect x="30" y="257" width="385" height="30" rx="7" fill="#a95834"/><text x="48" y="277" fill="white">6 · =  &lt;&gt;  &lt;  &gt;  &lt;=  &gt;=</text><rect x="30" y="296" width="340" height="30" rx="7" fill="#7655a6"/><text x="48" y="316" fill="white">7–8 · e  →  ou / xou</text></g></svg>
