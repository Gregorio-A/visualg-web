<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230" role="img" aria-labelledby="t d"><title id="t">Chamada e retorno de um subprograma</title><desc id="d">O programa principal passa argumentos a um procedimento ou função; o subprograma executa e retorna ao ponto da chamada, opcionalmente com um valor.</desc><rect width="720" height="230" rx="18" fill="#f4f7fc"/><g font-family="system-ui,sans-serif" text-anchor="middle"><rect x="30" y="82" width="160" height="66" rx="12" fill="#173e68"/><text x="110" y="110" fill="white" font-size="14" font-weight="700">programa principal</text><text x="110" y="131" fill="#dceaff" font-size="12">chama(nome, idade)</text><path d="M190 115h128" stroke="#607a98" stroke-width="3"/><path d="m309 108 10 7-10 7" fill="none" stroke="#607a98" stroke-width="3"/><rect x="320" y="62" width="178" height="106" rx="12" fill="#e5eef9" stroke="#4773a2" stroke-width="2"/><text x="409" y="95" fill="#173e68" font-size="14" font-weight="700">procedimento / função</text><text x="409" y="120" fill="#344d68" font-size="12">recebe parâmetros</text><text x="409" y="141" fill="#344d68" font-size="12">executa seu bloco</text><path d="M498 115h112" stroke="#607a98" stroke-width="3"/><path d="m505 108-10 7 10 7" fill="none" stroke="#607a98" stroke-width="3"/><rect x="610" y="82" width="82" height="66" rx="12" fill="#dcefe7" stroke="#39815e" stroke-width="2"/><text x="651" y="110" fill="#174b35" font-size="13" font-weight="700">retorno</text><text x="651" y="131" fill="#174b35" font-size="11">valor ou nada</text><text x="360" y="205" fill="#4c6078" font-size="12">Funções produzem um valor; procedimentos executam ações.</text></g></svg>
