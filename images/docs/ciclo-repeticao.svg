<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="t d"><title id="t">Ciclo de uma estrutura de repetição</title><desc id="d">Inicializar, verificar condição, executar comandos, atualizar e repetir ou finalizar.</desc><rect width="720" height="250" rx="18" fill="#f4f7fc"/><g font-family="system-ui,sans-serif" text-anchor="middle"><rect x="28" y="91" width="120" height="56" rx="12" fill="#173e68"/><text x="88" y="125" fill="white" font-size="14" font-weight="700">inicializar</text><path d="M148 119h57" stroke="#607a98" stroke-width="3"/><path d="m198 112 10 7-10 7" fill="none" stroke="#607a98" stroke-width="3"/><path d="M278 62 333 119 278 176 223 119z" fill="white" stroke="#2360a0" stroke-width="3"/><text x="278" y="124" fill="#173e68" font-size="13" font-weight="700">condição?</text><path d="M333 119h50v-54h45" stroke="#607a98" stroke-width="3" fill="none"/><path d="m421 58 10 7-10 7" fill="none" stroke="#607a98" stroke-width="3"/><path d="M333 119h50v57h45" stroke="#607a98" stroke-width="3" fill="none"/><path d="m421 169 10 7-10 7" fill="none" stroke="#607a98" stroke-width="3"/><rect x="431" y="39" width="132" height="52" rx="10" fill="#dcefe7" stroke="#39815e" stroke-width="2"/><text x="497" y="71" fill="#174b35" font-size="13" font-weight="700">executar bloco</text><rect x="431" y="150" width="132" height="52" rx="10" fill="#fbe8df" stroke="#a95834" stroke-width="2"/><text x="497" y="182" fill="#6e321c" font-size="13" font-weight="700">encerrar</text><path d="M563 65h75v54H333" stroke="#607a98" stroke-width="3" fill="none"/><path d="m341 112-8 7 8 7" fill="none" stroke="#607a98" stroke-width="3"/><text x="594" y="52" fill="#4c6078" font-size="12">atualiza</text><text x="350" y="232" fill="#4c6078" font-size="12">No para, enquanto e repita, a ordem de teste varia; consulte cada forma abaixo.</text></g></svg>
