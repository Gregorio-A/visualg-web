name: Windows portátil

on:
  workflow_dispatch:
  push:
    tags:
      - 'v1.13.0'

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - run: npm run make:portable:win
      - name: Conferir EXE e gerar SHA-256
        shell: pwsh
        run: |
          $files = @(Get-ChildItem 'out/portable/*.exe')
          if ($files.Count -ne 1) { throw "Esperado um EXE portátil; encontrados $($files.Count)." }
          $file = $files[0]
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content -Path 'out/portable/SHA256SUMS.txt' -Encoding ascii
          Write-Host "Artefato: $($file.Name) ($($file.Length) bytes)"
      - uses: actions/upload-artifact@v4
        with:
          name: visualg-windows-portable
          path: |
            out/portable/*.exe
            out/portable/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $file = (Get-ChildItem 'out/portable/*.exe' | Select-Object -First 1).FullName
          gh release create $env:GITHUB_REF_NAME $file 'out/portable/SHA256SUMS.txt' --verify-tag --title "VisuAlg Web $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES_1.13.0.md
